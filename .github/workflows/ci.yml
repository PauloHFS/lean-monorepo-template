name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Push seguido de push: cancela o run anterior do mesmo ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: o CI so precisa ler o repo.
permissions:
  contents: read

jobs:
  backend:
    name: backend (lint + type + test + sast)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.10"
          enable-cache: true

      - name: Install deps
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Typecheck (pyright)
        run: uv run pyright app tests

      - name: Security SAST (bandit)
        run: uv run bandit -r app --severity-level medium

      - name: Test (pytest)
        run: uv run pytest -q

  dependency-audit:
    name: pip-audit (deps de producao do backend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.10"
          enable-cache: true
      - name: Sync deps de producao
        run: UV_PROJECT_ENVIRONMENT=.venv-audit uv sync --frozen --no-dev
      - name: Audit (pip-audit)
        run: uvx pip-audit@2.10.1 --path .venv-audit/lib/python3.12/site-packages

  sast:
    name: semgrep (regras do projeto)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SEMGREP_SEND_METRICS: "off"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.10"

      - name: Semgrep (regras locais, offline)
        run: uvx semgrep@1.182.1 scan --config semgrep.yml --error apps/api/app apps/web/src

  frontend:
    name: frontend (lint + typecheck + build + audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

      - name: Audit de dependencias de producao
        run: npm audit --omit=dev --audit-level=high

  schema-sync:
    name: schema openapi -> web em sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.10"
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install deps
        run: |
          uv sync --locked --project apps/api
          npm ci --prefix apps/web

      - name: Checar drift do schema
        run: bash scripts/check-schema-sync.sh

  docker:
    name: docker image + scan de vulnerabilidades
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t lean-monorepo:ci .

      - name: Trivy (vulns na imagem)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lean-monorepo:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config --quiet
