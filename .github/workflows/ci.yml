name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Push seguido de push: cancela o run anterior do mesmo ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: o CI so precisa ler o repo.
permissions:
  contents: read

jobs:
  backend:
    name: backend (lint + type + test + sast)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Install deps
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check . && uv run ruff format --check .

      - name: Typecheck (pyright)
        run: uv run pyright app tests

      - name: Security SAST (bandit)
        run: uv run bandit -r app --severity-level medium

      - name: Test (pytest)
        run: uv run pytest -q

  dependency-audit:
    name: pip-audit (deps de producao do backend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
      - name: Sync deps de producao
        run: UV_PROJECT_ENVIRONMENT=.venv-audit uv sync --frozen --no-dev
      - name: Audit (pip-audit)
        run: uvx pip-audit@2.10.1 --path .venv-audit/lib/python3.13/site-packages

  sast:
    name: semgrep (regras do projeto)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SEMGREP_SEND_METRICS: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"

      - name: Semgrep (regras locais, offline)
        run: uvx semgrep@1.182.1 scan --config semgrep.yml --error apps/api/app apps/web/src apps/web/e2e

  frontend:
    name: frontend (lint + typecheck + build + audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Guard de drift: a versão do Node tem fonte única em `.node-version`;
      # o default do ARG no Dockerfile precisa bater com ela.
      - name: Guard Node version drift
        working-directory: .
        run: |
          set -euo pipefail
          expected=$(tr -d '[:space:]' < .node-version)
          arg=$(grep -oE '^ARG NODE_VERSION=[0-9]+' Dockerfile | cut -d= -f2)
          if [ "$expected" != "$arg" ]; then
            echo "::error::.node-version ($expected) diverge do ARG NODE_VERSION ($arg) no Dockerfile"
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

      - name: Audit de dependencias de producao
        run: npm audit --omit=dev --audit-level=moderate

  e2e:
    name: e2e (playwright, cenario mockado)
    runs-on: ubuntu-latest
    # Teto do job = soma dos tetos dos steps (install 10 + e2e 5) + setup.
    timeout-minutes: 20
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      # O install do Chromium travou 15 min 1x em 2 runs (CDN/apt do runner).
      # Cache dos browsers (pula o download) + teto por tentativa + 3 tentativas.
      - name: Restore cache dos browsers do Playwright
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}

      - name: Install Chromium
        timeout-minutes: 10
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
        run: |
          set -euo pipefail
          # O --with-deps roda apt-get e trava no lock do dpkg se o proprio
          # runner estiver em autoupdate (lock held by process NNNN (apt-get)).
          # Repetir nao resolve: espera o lock liberar (teto 120s por tentativa).
          wait_apt_lock() {
            local waited=0
            while [ "$waited" -lt 120 ]; do
              if ! command -v fuser >/dev/null 2>&1; then return 0; fi
              if ! sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; then return 0; fi
              echo "apt-get em execucao no runner (lock do dpkg): aguardando..."
              sleep 5
              waited=$((waited + 5))
            done
            echo "::warning::o lock do apt nao liberou em 120s; seguindo mesmo assim"
          }
          for attempt in 1 2 3; do
            wait_apt_lock
            if timeout --kill-after=15s 3m npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::install do Chromium falhou (tentativa ${attempt}/3); repetindo"
            sleep $((attempt * 10))
          done
          echo "::error::nao foi possivel instalar o Chromium"
          exit 1

      # Salva assim que o browser esta no disco, mesmo se o teste falhar depois:
      # o download e a parte cara e instavel, o teste e o gate.
      - name: Cache dos browsers do Playwright
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}

      # Só os specs que rodam sem API/DB (mock de rede via page.route).
      - name: E2E mockados
        timeout-minutes: 5
        run: npm run e2e -- e2e/smoke.spec.ts e2e/auth-failure.spec.ts e2e/async-flow.spec.ts

  schema-sync:
    name: schema openapi -> web em sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install deps
        run: |
          uv sync --locked --project apps/api
          npm ci --prefix apps/web

      - name: Checar drift do schema
        run: bash scripts/check-schema-sync.sh

  docker:
    name: docker image + scan de vulnerabilidades
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --build-arg NODE_VERSION="$(cat .node-version)" -t lean-monorepo:ci .

      # Mede o tamanho real da imagem e falha acima do teto, para travar regressão de layers.
      - name: Image size
        env:
          MAX_IMAGE_MB: "700"
        run: |
          set -euo pipefail
          bytes=$(docker image inspect lean-monorepo:ci --format '{{.Size}}')
          mb=$(awk -v b="$bytes" 'BEGIN { printf "%.1f", b / 1000000 }')
          echo "Imagem lean-monorepo:ci: ${mb} MB (teto: ${MAX_IMAGE_MB} MB)"
          echo "| imagem | ${mb} MB |" >> "$GITHUB_STEP_SUMMARY"
          awk -v mb="$mb" -v max="$MAX_IMAGE_MB" 'BEGIN { exit (mb > max) ? 1 : 0 }' || {
            echo "::error::Imagem ${mb} MB excede o teto de ${MAX_IMAGE_MB} MB"
            exit 1
          }

      # Boota o stack de verdade: "build + scan" não pega entrypoint quebrado
      # (exit 127), migration que não aplica nem health que não volta. Foi
      # assim que o exit-127 do login shell e o `alembic` quebrado chegaram à main.
      - name: Boot do stack (migrate + api + worker)
        env:
          GRAFANA_ADMIN_PASSWORD: validation-only
        run: |
          set -euo pipefail
          cp .env.example .env
          if ! docker compose up -d; then
            docker compose logs migrate api || true
            exit 1
          fi
          # api tem que responder readiness com o banco de pé
          for _ in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8000/api/v1/healthz 2>/dev/null | grep -q '"db":true'; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/v1/healthz
          echo
          # migration aplicada de verdade
          docker compose exec -T postgres psql -U app -d app \
            -c 'select version_num from alembic_version'
          # worker vivo
          docker compose ps --services --filter status=running | grep -qx worker
          docker compose down -v

      - name: Trivy (vulns na imagem)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lean-monorepo:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare .env for compose validation
        run: cp .env.example .env

      - name: Validate compose file
        env:
          GRAFANA_ADMIN_PASSWORD: validation-only
        run: docker compose config --quiet
