name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Push seguido de push: cancela o run anterior do mesmo ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: o CI so precisa ler o repo.
permissions:
  contents: read

jobs:
  backend:
    name: backend (lint + type + test + sast)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -q -r requirements.txt

      - name: Lint (ruff)
        run: . .venv/bin/activate && ruff check .

      - name: Typecheck (pyright)
        run: . .venv/bin/activate && pyright app

      - name: Security SAST (bandit)
        run: . .venv/bin/activate && bandit -r app --severity-level medium

      - name: Test (pytest)
        run: . .venv/bin/activate && pytest -q

  frontend:
    name: frontend (lint + typecheck + build + audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

      - name: Audit de dependencias de producao
        run: npm audit --omit=dev --audit-level=high

  schema-sync:
    name: schema openapi -> web em sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install deps
        run: |
          python -m venv apps/api/.venv
          apps/api/.venv/bin/pip install -q -r apps/api/requirements.txt
          npm ci --prefix apps/web

      - name: Checar drift do schema
        run: bash scripts/check-schema-sync.sh

  docker:
    name: docker image + scan de vulnerabilidades
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t lean-monorepo:ci .

      - name: Trivy (vulns na imagem)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lean-monorepo:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config --quiet
