version: 2
updates:
  # O repo usa pins exatos; sem PRs automatizados um CVE so aparece na auditoria.
  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
    groups:
      # As instrumentacoes OpenTelemetry (0.66b1) precisam subir juntas.
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
