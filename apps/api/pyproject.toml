# =============================================================================
# Backend Lean — dependências gerenciadas pelo uv.
# Fonte de verdade: uv.lock (versões exatas, com hashes).
# Comandos: `uv sync` (instala), `uv run <cmd>` (executa no venv do projeto).
# =============================================================================

[project]
name = "lean-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    # --- Web ---
    "fastapi==0.142.2",
    "uvicorn[standard]==0.32.1",
    "python-multipart==0.0.31",
    # --- Config / validação ---
    "pydantic==2.10.3",
    "starlette==1.10.0",
    "pydantic-settings==2.7.0",
    "email-validator==2.2.0",
    # --- Banco (async) ---
    "SQLAlchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "psycopg2-binary==2.9.10", # só para o Alembic rodar offline/env.py sync
    "alembic==1.14.0",
    # --- Auth / segurança ---
    "bcrypt==4.2.1", # lib direto, sem passlib (incompatível c/ bcrypt>=4.1)
    "itsdangerous==2.2.0", # assinatura do cookie de sessão
    # --- Email SMTP (Mailpit dev, Resend/SES/Postmark/Mailgun/Brevo prod) ---
    "aiosmtplib==5.1.3",
    # --- Filas (Procrastinate, Postgres-first; sem Redis/Celery) ---
    "procrastinate[sqlalchemy]==3.10.0",
    # Driver psycopg3 (usado pelo connector async do Procrastinate). O extra
    # [binary] traz wheels com libpq embutida — necessário em macOS/dev sem libpq
    # do sistema; no Docker (libpq-dev) também funciona.
    "psycopg[binary]==3.3.6",
    # --- Logging / utilitários ---
    "structlog==24.4.0",
    "tenacity==9.0.0", # retries com backoff
    # --- 2FA (TOTP + passkeys) ---
    "pyotp==2.9.0",
    "webauthn==3.0.1",
    # --- Observability (OpenTelemetry + Sentry opcional) ---
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.1",
    "opentelemetry-instrumentation-fastapi==0.66b1",
    "opentelemetry-instrumentation-sqlalchemy==0.66b1",
    "opentelemetry-instrumentation-logging==0.66b1",
    "sentry-sdk[fastapi]==2.19.2",
]

[dependency-groups]
dev = [
    # --- Testes ---
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    # --- Testes de propriedades (MPL-2.0) ---
    "hypothesis==6.170.9",
    # --- Lint / type / SAST ---
    "ruff==0.8.4",
    "pyright==1.1.414",
    "bandit==1.8.6",
]

[tool.uv]
# App semempacotamento: nada é publicado no PyPI, o uv sync só instala deps.
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

# ---- Ruff ----
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "migrations/versions"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, B: bugbear, UP: pyupgrade, SIM: simplify
select = ["E", "F", "I", "B", "UP", "SIM", "PL"]
ignore = [
    "E501",   # line length (handled by formatter)
    "PLR0913",# many args
    "PLR2004", # magic value — barulhento em testes
    "B008",   # function call in default arg (FastAPI Depends)
    "SIM108", # ternary vs if/else (estilo)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101", "B011"]
"migrations/*" = ["E", "F", "I", "B", "UP", "PL"] # gerado, não mexe
# observability.py: imports lazy são propositais (OTel/Sentry só carrega se env setado)
"app/core/observability.py" = ["PLC0415"]
# email.py: SmtpProvider tem 8 args de config — todos via env, não vale agrupar
"app/core/email.py" = ["PLR0913", "PLR0917"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---- Pyright ----
# Config em pyrightconfig.json (typed, fora do pyproject).
# Modo "strict" em app e tests; sem lista de exclusões. A única relaxação é
# reportMissingTypeStubs=warning (libs de terceiro sem stubs).
