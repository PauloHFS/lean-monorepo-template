# https://pre-commit.com/
# Instale com `pip install pre-commit` e rode `pre-commit install` uma vez.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: local
    hooks:
      - id: schema-sync
        name: OpenAPI schema in sync with backend
        entry: scripts/check-schema-sync.sh
        language: script
        pass_filenames: false
        types: [python]