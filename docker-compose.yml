# =============================================================================
# Stack do lean monorepo.
# Perfis:
#   - default: postgres + pgbouncer + migrate + api + worker (a stack inteira)
#   - dev:     mailpit (SMTP de captura + web UI), só quando pedido
#   - observability: otel-collector + tempo + prometheus + grafana
# Serviços core SEM profile: o Coolify roda `docker compose up -d` sem
# `--profile` e serviço com profile não sobe.
#
# Portas: este arquivo é o artefato de deploy e NÃO publica porta no host
# (api e postgres ficam só com `expose:`). Quem publica 127.0.0.1:8000 e
# 127.0.0.1:5432 no dev local é o `docker-compose.override.yml`, mesclado
# automaticamente pelo `docker compose` sem `-f`. O Coolify e o CI usam `-f`
# explícito e portanto ignoram o override.
# =============================================================================
name: python-postgres-full-template

services:
  postgres:
    # Imagem oficial (arm64 nativo): a antiga postgis/postgis:16-3.4 era amd64-only.
    # Nada no app usa PostGIS hoje (a extensão segue opt-in via imagem própria).
    # No PG18 o PGDATA vive em
    # /var/lib/postgresql/18/docker e o VOLUME é /var/lib/postgresql (por isso o
    # mount abaixo não leva o sufixo /data das majors 16/17).
    image: postgres:18-alpine
    container_name: lm_postgres
    restart: unless-stopped
    # Shutdown com folga: o Postgres precisa fechar as conexões e fechar o
    # checkpoint antes do SIGKILL (o default do Docker são 10s).
    stop_grace_period: 30s
    # Defaults (app/app) são só para dev local; sobrescreva em qualquer ambiente real.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      TZ: ${TZ:-UTC}
    # Tuning do Postgres versionado (docs/tuning.md §2). O `command:` é a fonte
    # da verdade: NÃO use ALTER SYSTEM (o valor fica preso no postgresql.auto.conf
    # dentro do volume pgdata e some quando o volume é recriado).
    # shared_buffers/effective_cache_size dependem da RAM do host — ajuste no
    # .env da VPS (tabela por faixa em docs/tuning.md). Os defaults abaixo
    # valem de 2 GB para cima; o alvo do repo (8 GB) é 2GB/6GB.
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-3GB}
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      # max_connections fica no default (100): o pgbouncer existe justamente
      # para não precisar subir esse teto (e a API sem pooler ainda pode abrir
      # DB_POOL_SIZE + DB_MAX_OVERFLOW = 30 conexões).
      - -c
      - max_wal_size=4GB
      - -c
      - min_wal_size=1GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - log_min_duration_statement=500ms
      - -c
      - jit=off
    expose:
      # Sem porta publicada no host: o backup/restore em prod roda por
      # `docker compose exec` (ver scripts/backup.sh) e o Coolify fala com o
      # container pela rede Docker.
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./scripts:/app/scripts:ro
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 3s
      retries: 10
      # Volume novo: initdb + scripts de init levam mais de 50s numa VPS. O
      # primeiro probe só roda depois do start_period, e falha durante ele não
      # conta como retry (o healthcheck não estoura no 1º deploy).
      start_period: 60s

  # ---- pgbouncer: pooler de conexao da API (AD-037) -----------------------
  # Sem `profiles:` pelo mesmo motivo dos demais servicos core (bug #6395 do
  # Coolify). Fica sempre no ar, mas so tem efeito quando a API recebe
  # DATABASE_URL_POOLER; sem ela, a API fala direto no Postgres.
  # Somente a API usa o pooler: worker (LISTEN/NOTIFY) e migrate (DDL) precisam
  # de conexao direta e persistente.
  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0
    container_name: lm_pgbouncer
    restart: unless-stopped
    # Sem porta publicada no host: a API fala pela rede Docker e o console
    # admin nao sai do container.
    environment:
      # Mesmas credenciais do Postgres: o auth_file aceita senha em texto e o
      # proprio pgbouncer faz o SCRAM na conexao com o servidor.
      DB_USER: ${POSTGRES_USER:-app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-app}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-app}
      # Porta interna do pgbouncer (a default da imagem, 5432, colidiria
      # conceitualmente com o Postgres).
      LISTEN_PORT: 6432
      AUTH_TYPE: scram-sha-256
      ADMIN_USERS: ${POSTGRES_USER:-app}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 25
      MIN_POOL_SIZE: 2
      RESERVE_POOL_SIZE: 5
      RESERVE_POOL_TIMEOUT: 5
      MAX_DB_CONNECTIONS: 50
      QUERY_WAIT_TIMEOUT: 60
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
      # Explicito (nao depender do default da imagem): e o que faz o asyncpg
      # funcionar em transaction mode.
      MAX_PREPARED_STATEMENTS: 200
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # `$$` escapa a interpolacao do Compose: as vars sao lidas no container.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U \"$$DB_USER\" -d \"$$DB_NAME\""]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- Postgres gerenciado (Neon/RDS/Cloud SQL) ---------------------------
  # Para trocar por um Postgres externo, edite este arquivo:
  #   1. remova os serviços `postgres` e `pgbouncer` (as linhas acima);
  #   2. remova `depends_on: postgres`/`pgbouncer` (`condition: service_healthy`)
  #      de `migrate`, `api` e `worker`, e `DATABASE_URL_POOLER` do `api`;
  #   3. remova `POSTGRES_HOST: postgres` do `environment:` dos três (ele
  #      vence o `env_file`) e defina `DATABASE_URL` + `DB_SSLMODE=require`.
  # Se quiser manter um pooler com Postgres gerenciado, aponte `DB_HOST` do
  # pgbouncer para o host externo (e use TLS upstream via `SERVER_TLS_SSLMODE`).
  # Só `citext` é exigida (a migration cria). As extensões contrib de
  # `scripts/postgres-init` (pg_trgm/ltree/pgcrypto/...) já vêm na imagem
  # oficial; `vector` e `pg_cron` não vêm e nada no app as usa hoje.
  # Passo a passo: docs/deploy.md, "Trocar para Postgres gerenciado".

  # ---- Mailpit: SMTP server com web UI para dev/test ----------------------
  # Captura emails enviados pelo SmtpProvider. Ver em http://localhost:8025
  # Perfil `dev`: isolado do stack core; só sobe quando pedido explicitamente
  # (`--profile dev`), expondo o relay SMTP accept-any (1025) e a UI (8025).
  mailpit:
    image: axllent/mailpit:v1.32.0
    container_name: lm_mailpit
    profiles: ["dev"]
    restart: unless-stopped
    environment:
      MP4_SMTP_AUTH_ACCEPT_ANY: 1
      MP4_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      # Loopback: o relay SMTP accept-any e a UI ficam só na máquina. Em 0.0.0.0
      # (o default do Compose) a VPS exporia um SMTP aberto para a internet.
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # Web UI

  # ---- Migrations one-shot: roda uma vez e sai ----------------------------
  # api e worker dependem de `service_completed_successfully`, então o
  # `alembic upgrade head` acontece uma única vez (sem corrida entre eles).
  # `migrate`, `api` e `worker` apontam para a MESMA tag (${APP_IMAGE}): o
  # build é feito uma vez por deploy e os três containers saem do mesmo
  # artefato — sem `image:`, o Compose criaria uma tag por serviço e o
  # Coolify.buildaria a mesma imagem três vezes.
  migrate:
    image: ${APP_IMAGE:-python-postgres-full-template:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lm_migrate
    restart: "no"
    # One-shot: não serve HTTP, então o HEALTHCHECK da imagem (que sobe o
    # /api/v1/livez) falharia para sempre → "unhealthy" sem significado.
    healthcheck:
      disable: true
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      # Mesmo default do serviço postgres: app e banco precisam concordar.
      # Sem isso, um .env com POSTGRES_PASSWORD vazio dá DSN sem senha no app
      # e senha 'app' no banco → "password authentication failed" no boot.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["bash", "-lc", "/app/scripts/entrypoint.sh migrate"]

  api:
    image: ${APP_IMAGE:-python-postgres-full-template:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lm_api
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      SPA_DIST_PATH: /app/apps/web/dist
      # Vazio = DSN direto (POSTGRES_*/DATABASE_URL). Defina no .env para usar
      # o pooler: postgresql+asyncpg://app:app@pgbouncer:6432/app
      DATABASE_URL_POOLER: ${DATABASE_URL_POOLER:-}
    expose:
      # Porta interna do container. No Coolify o proxy (Traefik) fala com o
      # container pelo IP da rede Docker; no dominio, o sufixo precisa ser
      # :8000. As portas de dev local vivem em docker-compose.override.yml.
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["bash", "-lc", "/app/scripts/entrypoint.sh api"]

  worker:
    image: ${APP_IMAGE:-python-postgres-full-template:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lm_worker
    restart: unless-stopped
    stop_grace_period: 30s
    # O worker não serve HTTP: o HEALTHCHECK da imagem (que sobe o /api/v1/livez)
    # falharia para sempre. A saúde do worker é o próprio processo Procrastinate.
    healthcheck:
      disable: true
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["bash", "-lc", "/app/scripts/entrypoint.sh worker"]

  # ---- Observability (Grafana stack, free e self-hosted) -------------------
  # Sobe com: docker compose --profile observability up -d
  # Quando ativo, o app deve ser startado com:
  #   OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: lm_otel_collector
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./scripts/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      # Loopback: o app injeta OTLP por `otel-collector:4317` (rede Docker) e o
      # Prometheus scrapeia `otel-collector:8889` — o publish no host não é
      # usado por nada do stack e, em 0.0.0.0, seria um ingest OTLP aberto.
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP

  tempo:
    image: grafana/tempo:2.6.0
    container_name: lm_tempo
    profiles: ["observability"]
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./scripts/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"   # tempo API

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: lm_prometheus
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./scripts/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus

  grafana:
    image: grafana/grafana:11.3.1
    container_name: lm_grafana
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      # Obrigatória: sem ela o Grafana 11.3.1 cai no default admin/admin.
      # `:?` faz o compose recusar subir a stack sem credencial explícita.
      # A interpolação do Compose é global: o deploy falha sem ela, mesmo sem
      # o profile observability.
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD (a interpolação do Compose é global: o deploy falha sem ela, mesmo sem o profile observability)}"
    ports:
      # Loopback: o Grafana fica atrás do proxy do Coolify (ou de um tunnel) —
      # em 0.0.0.0 ele ficaria público na porta 3000 da VPS.
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  pgdata:
  tempo-data:
  prom-data:
  grafana-data:
