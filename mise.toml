# Versões das ferramentas de dev — `mise install` prepara o ambiente.
#
# O Python NÃO entra aqui: quem manda no interpretador é o uv (AD-013), via
# `.python-version` e `apps/api/uv.lock`. Duas ferramentas donas do mesmo
# interpretador só brigam.
#
# As tasks continuam no `justfile`: o mise fixa versões, o just roda os
# ~30 comandos do projeto.
#
# Node NÃO entra em [tools]: a versão mora em `.node-version` (fonte única,
# também lida pelo Docker e pelo CI). Abaixo o mise é habilitado a ler esse
# arquivo idiomaticamente.
[settings]
idiomatic_version_file_enable_tools = ["node"]

[tools]
just = "1"
uv = "0.13"
